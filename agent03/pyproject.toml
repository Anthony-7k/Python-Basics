[project]
name = "docflow-ai"
version = "0.1.0"
description = "DocFlow AI multimodal document review platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "celery>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pillow>=10,<13",
    "prometheus-client>=0.21,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "PyJWT>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "python-docx>=1.1,<2",
    "pymupdf>=1.24,<2",
    "redis>=5,<7",
    "s3fs>=2024.9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ocr = ["rapidocr>=3.10,<4", "onnxruntime>=1.20,<2"]
demo = ["reportlab>=4,<5"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
]

[project.scripts]
docflow = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

