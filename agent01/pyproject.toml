[project]
name = "agent01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anthony-7k", email = "2652424619@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "chromadb>=1.5.9",
    "cryptography>=42",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pymysql>=1.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.62.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
agent01 = "agent01:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [
    "."
]
